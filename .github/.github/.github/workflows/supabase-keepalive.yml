name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Supabase to prevent auto-pause
    runs-on: ubuntu-latest
    steps:
      - name: Wake Supabase project
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wcmvtfclkybgdwjybyzb.supabase.co/rest/v1/")
          echo "Supabase ping status: $STATUS"
          echo "Project is alive — auto-pause clock reset"
